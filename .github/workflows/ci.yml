name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Typen, Lint, Tests, Web-Export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Web-Export (SPA)
        run: npm run web:export
        env:
          # Platzhalter: reicht, damit der Export die Konfiguration als gültig erkennt.
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret

  database:
    name: Datenbank (Migrationen, pgTAP, Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Startet die lokale Supabase-Umgebung (Docker) und wendet alle Migrationen samt Seed an.
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: supabase db lint --fail-on error
      - name: Typen aus den Migrationen müssen eingecheckt sein
        run: |
          # Greift, sobald M1 die erste Typdatei einchecken lässt (docs/05 §3.3).
          if [ -f supabase/functions/_shared/database.types.ts ]; then
            supabase gen types typescript --local > /tmp/database.types.ts
            diff -u supabase/functions/_shared/database.types.ts /tmp/database.types.ts
          fi
